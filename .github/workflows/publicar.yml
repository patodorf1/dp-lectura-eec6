name: Publicar diario
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # para preguntarle a GitHub si ya ve el libro
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      # Si falla la instalación, el libro sale igual, sin fotos
      - uses: actions/setup-python@v6
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Instalar Pillow (fotos del libro)
        continue-on-error: true
        run: pip install pillow
      - name: Armar EPUBs y catálogo
        run: |
          mkdir -p site/ediciones
          for f in $(ls ediciones/*.json | sort -r | head -7); do
            python3 scripts/build_epub.py "$f" "site/ediciones/$(basename "$f" .json).epub"
          done
          python3 scripts/build_opds.py "${{ steps.pages.outputs.base_url }}"
          python3 scripts/build_historial.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub a veces tarda en mostrar el libro recién subido y el paso de
      # publicar lo busca enseguida (falló así el 24-nov). Esperamos a que aparezca.
      - name: Esperar a que GitHub vea el libro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                  --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -ge 1 ] && echo "GitHub ya ve el libro" && exit 0
            sleep 5
          done
          echo "GitHub no mostró el libro en 2 minutos; se intenta publicar igual"
      - id: deploy
        uses: actions/deploy-pages@v5
